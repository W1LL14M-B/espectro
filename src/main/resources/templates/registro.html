<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
  <div class="wrap">
    <section class="card">
      <p class="brand">Conectividad Espectro</p>
      <h1>Crear cuenta</h1>
      <p class="subtitle">Regístrate para usar el servicio.</p>

      <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
        <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
      </div>

      <form th:action="@{/registro}" th:object="${form}" method="post">
        <label for="nombre">Nombre</label>
        <input id="nombre" th:field="*{nombre}" type="text" autocomplete="name" required>
        <p class="errors" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>

        <label for="email">Correo</label>
        <input id="email" th:field="*{email}" type="email" autocomplete="email" required>
        <p class="errors" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label for="password">Contraseña</label>
        <input id="password" th:field="*{password}" type="password" autocomplete="new-password" required>
        <p class="errors" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <label for="confirmarPassword">Confirmar contraseña</label>
        <input id="confirmarPassword" th:field="*{confirmarPassword}" type="password" autocomplete="new-password" required>
        <p class="errors" th:if="${#fields.hasErrors('confirmarPassword')}" th:errors="*{confirmarPassword}"></p>

        <button type="submit">Registrarme</button>
      </form>

      <p class="switch">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
    </section>
  </div>
</body>
</html>
