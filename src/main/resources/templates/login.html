<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
  <div class="wrap">
    <section class="card">
      <p class="brand">Conectividad Espectro</p>
      <h1>Iniciar sesión</h1>
      <p class="subtitle">Entra con el correo de tu cuenta.</p>

      <div th:if="${param.error}" class="alert error">Correo o contraseña incorrectos.</div>
      <div th:if="${param.logout}" class="alert ok">Sesión cerrada.</div>
      <div th:if="${mensaje}" class="alert ok" th:text="${mensaje}"></div>

      <form th:action="@{/login}" method="post">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="username" required>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Entrar</button>
      </form>

      <p class="switch">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
    </section>
  </div>
</body>
</html>
